<body>
<header>
  <div>
    <h1>SGC Arabia – Corporate Income Tax Calculation</h1>
    <div class="sub" id="hsub">Year-end tax provision: Corporate Income Tax &amp; Deferred Tax (amounts in SAR)</div>
  </div>
  <div class="hbtns">
    <label for="yearSel" class="sub">Fiscal year</label>
    <select id="yearSel" title="Open a saved fiscal year or start a new one"></select>
    <span class="sub" id="storeInfo"></span>
    <button id="btnFolder" title="Pick the team's shared network folder so everyone sees the same data"></button>
    <button id="btnPrint" title="Print the tax computation, deferred tax and notices (or save as PDF)">Print / PDF</button>
  </div>
</header>
<nav role="tablist" aria-label="Sections" id="nav"></nav>
<main id="main"></main>
<aside id="side" aria-label="Source data"></aside>
<div id="hltip" role="tooltip" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div>
  <h2 id="modalTitle" style="margin:0 0 8px;font-size:16px"></h2><div id="modalBody"></div>
  <div class="row"><button id="modalCancel">Cancel</button><button id="modalOk" class="danger"></button></div>
</div></div>

<script>
'use strict';
/* =====================================================================
   SGC Arabia – Corporate Income Tax Calculation
   Static app (no server). Data is written only to the team's shared folder or this browser.
   Sections: 1) xlsx reader  2) sheet parsers  3) calculations  4) notices  5) storage  6) state  7) UI
   ===================================================================== */

/* ---------- 1) Minimal .xlsx reader (zip + XML, no external library) ---------- */
async function readXlsx(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0) throw new Error('This is not a valid .xlsx file.');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true);
  const td=new TextDecoder(), files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('The .xlsx file is damaged.');
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
      nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    files[name]={method,csize,lo}; p+=46+nl+el+cl;
  }
  async function text(name){
    const f=files[name]; if(!f) return null;
    const lnl=dv.getUint16(f.lo+26,true), lel=dv.getUint16(f.lo+28,true);
    const data=u8.subarray(f.lo+30+lnl+lel, f.lo+30+lnl+lel+f.csize);
    if(f.method===0) return td.decode(data);
    if(f.method!==8) throw new Error('Unsupported compression in the .xlsx file.');
    const ab=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return td.decode(ab);
  }
  const xml=s=>new DOMParser().parseFromString(s,'application/xml');
  const wbTxt=await text('xl/workbook.xml');
  if(!wbTxt) throw new Error('This file is not an Excel workbook (.xlsx). Old .xls files must be re-saved as .xlsx first.');
  const wb=xml(wbTxt), rels=xml(await text('xl/_rels/workbook.xml.rels'));
  const relMap={}; for(const r of rels.getElementsByTagName('Relationship')) relMap[r.getAttribute('Id')]=r.getAttribute('Target');
  const sst=[]; const sstTxt=await text('xl/sharedStrings.xml');
  if(sstTxt){ for(const si of xml(sstTxt).getElementsByTagName('si')){
    let s=''; for(const t of si.getElementsByTagName('t')){ if(t.parentNode.localName!=='rPh') s+=t.textContent; } sst.push(s); } }
  const sheets=[];
  for(const s of wb.getElementsByTagName('sheet')){
    const rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target=relMap[rid]; if(!target) continue;
    target=target.startsWith('/')?target.slice(1):'xl/'+target;
    const stxt=await text(target); if(!stxt) continue;
    const rows=[];
    for(const c of xml(stxt).getElementsByTagName('c')){
      const ref=c.getAttribute('r'); const m=/^([A-Z]+)(\d+)$/.exec(ref||''); if(!m) continue;
      let col=0; for(const ch of m[1]) col=col*26+ch.charCodeAt(0)-64; col--; const row=+m[2]-1;
      const t=c.getAttribute('t'); let v=null;
      const vEl=[...c.children].find(x=>x.localName==='v');
      if(t==='inlineStr'){ v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''); }
      else if(vEl){ const raw=vEl.textContent;
        if(t==='s') v=sst[+raw]; else if(t==='str') v=raw; else if(t==='b') v=raw==='1'; else if(t==='e') v=null; else { const num=Number(raw); v=isNaN(num)?raw:num; } }
      if(v===null||v==='') continue;
      (rows[row]||(rows[row]=[]))[col]=v;
    }
    sheets.push({name:s.getAttribute('name'),rows});
  }
  return sheets;
}

/* ---------- 2) Sheet detection and parsers ---------- */
const S=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
const N=v=>typeof v==='number'?v:(v==null||v===''?0:(isNaN(Number(String(v).replace(/,/g,'')))?0:Number(String(v).replace(/,/g,''))));
function findCell(rows,re,fromRow=0){
  for(let r=fromRow;r<rows.length;r++){ const row=rows[r]; if(!row) continue;
    for(let c=0;c<row.length;c++){ if(typeof row[c]==='string'&&re.test(S(row[c]))) return {r,c}; } }
  return null;
}
function detectKind(rows){
  if(findCell(rows,/^Particulars$/i)&&findCell(rows,/^Dr \(YTD\)$/i)) return 'tb';
  if(findCell(rows,/^Opening Balance$/i)&&findCell(rows,/^Ending Balance$/i)) return 'prov';
  if(findCell(rows,/^Depreciation Rate$/i)&&findCell(rows,/^Land$/i)) return 'ppe';
  if(findCell(rows,/^Principal Amount/i)) return 'guar';
  return null;
}
function parseTB(rows){
  const h=findCell(rows,/^Particulars$/i); const hr=rows[h.r];
  const col=re=>{ for(let c=0;c<hr.length;c++) if(re.test(S(hr[c]))) return c; return -1; };
  const C={name:h.c,code:col(/^Code$/i),opDr:col(/^Dr \(Op/i),opCr:col(/^Cr \(Op/i),dr:col(/^Debits/i),cr:col(/^Credits/i),ytdDr:col(/^Dr \(YTD/i),ytdCr:col(/^Cr \(YTD/i)};
  const missing=Object.entries(C).filter(([k,v])=>v<0).map(([k])=>k);
  if(missing.length) throw new Error('Trial balance: column(s) not found – '+missing.join(', ')+'. Expected headers: Particulars, Code, Dr (Op bal), Cr (Op bal), Debits for the period, Credits for the period, Dr (YTD), Cr (YTD).');
  let company='',period='';
  for(let r=0;r<h.r;r++){ for(const v of rows[r]||[]){ const s=S(v); if(!s) continue;
    if(/date range/i.test(s)) period=s; else if(!/^trial balance$/i.test(s)&&!company) company=s; } }
  const accts=[]; let grand=null, profit=null;
  for(let r=h.r+1;r<rows.length;r++){ const row=rows[r]; if(!row) continue;
    const rawName=row[C.name]; const name=S(rawName); if(!name) continue;
    const o={name,indent:(typeof rawName==='string'&&/^\s/.test(rawName))?1:0,code:S(row[C.code]),opDr:N(row[C.opDr]),opCr:N(row[C.opCr]),dr:N(row[C.dr]),cr:N(row[C.cr]),ytdDr:N(row[C.ytdDr]),ytdCr:N(row[C.ytdCr])};
    if(/^Grand Total$/i.test(name)){ grand=o; continue; }
    if(/^Profit for the period$/i.test(name)||/^Loss for the period$/i.test(name)){ profit=o; profit.isLoss=/^Loss/i.test(name); continue; }
    if(grand) continue;            // ignore anything below the Grand Total (working area)
    if(!o.code) continue;
    accts.push(o);
  }
  if(!accts.length) throw new Error('Trial balance: no account rows were found below the header row.');
  const ym=/(\d{2})\/(\d{2})\/(\d{4})\s*to\s*(\d{2})\/(\d{2})\/(\d{4})/.exec(period);
  return {company,period,year:ym?+ym[6]:null,accts,grand,profit};
}
function parseProv(rows){
  const h=findCell(rows,/^Opening Balance$/i); const hr=rows[h.r];
  const col=re=>{ for(let c=0;c<hr.length;c++) if(re.test(S(hr[c]))) return c; return -1; };
  const C={name:col(/^Name$/i),open:h.c,prov:col(/^Provided/i),util:col(/^Utili[sz]ed/i),adj:col(/^Adjustments?/i),end:col(/^Ending Balance$/i)};
  if(C.name<0) C.name=h.c-1;
  const miss=Object.entries(C).filter(([k,v])=>v<0).map(([k])=>k);
  if(miss.length) throw new Error('Provision Movement: column(s) not found – '+miss.join(', ')+'. Expected headers: Name, Opening Balance, Provided during the year, Utilized during the year, Adjustments/ Reversals, Ending Balance.');
  const items=[];
  for(let r=h.r+1;r<rows.length;r++){ const row=rows[r]; if(!row) continue; const name=S(row[C.name]); if(!name) continue;
    if(/^Total$/i.test(name)) break;
    items.push({name,open:N(row[C.open]),prov:N(row[C.prov]),util:N(row[C.util]),adj:N(row[C.adj]),end:N(row[C.end])}); }
  if(!items.length) throw new Error('Provision Movement: no provision rows were found between the header and the "Total" row.');
  return {items};
}
function parsePPE(rows){
  const land=findCell(rows,/^Land$/i); const hr=rows[land.r];
  let tot=-1; for(let c=land.c+1;c<hr.length;c++){ if(/^Totals?$/i.test(S(hr[c]))){tot=c;break;} }
  if(tot<0) throw new Error('PPE – Depreciation: the "Totals" column was not found in the group header row.');
  const cols=[]; for(let c=land.c;c<tot;c++) cols.push(c);
  const groups=cols.map(c=>S(hr[c]));
  const rowOf=re=>{ for(let r=land.r+1;r<rows.length;r++){ const row=rows[r]; if(!row) continue; for(let c=0;c<land.c;c++){ if(typeof row[c]==='string'&&re.test(S(row[c]))) return r; } } return -1; };
  const vals=(re,label)=>{ const r=rowOf(re); if(r<0) throw new Error('PPE – Depreciation: row "'+label+'" was not found.'); return cols.map(c=>N((rows[r]||[])[c])); };
  const out={groups,
    open:vals(/^Ending Balance as per prior year/i,'Ending Balance as per prior year TR'),
    addCur:vals(/^Current Year.s Additions/i,"Current Year's Additions"),
    addPrior:vals(/^Prior Year.s Additions/i,"Prior Year's Additions"),
    consCur:vals(/^Current Year.s Considerations/i,"Current Year's Considerations"),
    consPrior:vals(/^Prior Year.s Considerations/i,"Prior Year's Considerations"),
    rate:vals(/^Depreciation Rate$/i,'Depreciation Rate'),
    rm:cols.map(()=>0), gl:null};
  const glr=rowOf(/as per GL/i);
  if(glr>=0){ const row=rows[glr]; let v=row[tot]; if(typeof v!=='number'){ for(let c=row.length-1;c>=land.c;c--) if(typeof row[c]==='number'){v=row[c];break;} } if(typeof v==='number') out.gl=v; }
  const gn=findCell(rows,/^Group Name$/i);
  if(gn){ const ex=findCell(rows,/^Expense$/i,gn.r);
    if(ex){ for(let r=gn.r+1;r<rows.length;r++){ const row=rows[r]; if(!row) continue;
      for(let c=0;c<land.c;c++){ const m=/^\(Group # ?(\d)\)/i.exec(S(row[c])); if(m){ const g=+m[1]; if(g>=1&&g<cols.length) out.rm[g]=N((rows[r-1]||[])[ex.c]); } } } } }
  return out;
}
function parseGuar(rows){
  const h=findCell(rows,/^Principal Amount/i); const hr=rows[h.r];
  const col=re=>{ for(let c=0;c<hr.length;c++) if(re.test(S(hr[c]))) return c; return -1; };
  const C={principal:h.c,start:col(/^Start date/i),end:col(/^End date/i),days:col(/^Days/i),rate:col(/^Guarantee Fee Rate/i),mv:col(/^Market Value/i)};
  if(C.days<0||C.rate<0) throw new Error('Normal Guarantee: columns "Days (360)" and/or "Guarantee Fee Rate (%)" were not found.');
  let marketRate=null;
  if(C.mv>=0){ for(let r=h.r+1;r<Math.min(rows.length,h.r+3);r++){ const v=(rows[r]||[])[C.mv]; if(typeof v==='number'&&v>0&&v<1&&typeof (rows[r]||[])[C.principal]!=='number'){ marketRate=v; break; } } }
  const sub=rows[h.r+1]||[]; const sc=re=>{ for(let c=0;c<sub.length;c++) if(re.test(S(sub[c]))) return c; return -1; };
  let cp=sc(/^Project$/i), cb=sc(/^Bond$/i), cr=sc(/^Related Party/i);
  if(cp<0) cp=0; if(cb<0) cb=1; if(cr<0) cr=2;
  const items=[]; let proj='';
  for(let r=h.r+1;r<rows.length;r++){ const row=rows[r]; if(!row) continue; const pv=row[C.principal];
    if(typeof pv!=='number') continue;
    if(S(row[cp])) proj=S(row[cp]);
    items.push({project:proj,bond:S(row[cb]),party:S(row[cr]),principal:pv,start:row[C.start]??null,end:row[C.end]??null,days:N(row[C.days]),rate:N(row[C.rate])}); }
  if(!items.length) throw new Error('Normal Guarantee: no guarantee rows with a principal amount were found.');
  return {items,marketRate};
}

/* ---------- 3) Calculations ---------- */
const DEFAULT_MAP={
  revenue:{label:'Projects Construction Revenue',use:'Income – Cr (YTD)',codes:['002-002']},
  otherIncome:{label:'Non-Operating Revenue',use:'Income – Cr (YTD)',codes:['002-0043']},
  cost:{label:'Projects Cost Expenses',use:'Expense – Dr (YTD)',codes:['002-004']},
  ga:{label:'General & Administrative Expenses',use:'Expense – Dr (YTD)',codes:['002-005']},
  nonOpExp:{label:'Non-Operating Expenses',use:'Expense – Dr (YTD)',codes:['002-0046']},
  interest:{label:'Interest Expenses',use:'Expense – Dr (YTD)',codes:['002-0049']},
  entertainment:{label:'Entertainment (disallowed)',use:'Add-back – Dr (YTD)',codes:['01-32','02-028']},
  taxDues:{label:'Tax & Dues (disallowed)',use:'Add-back – Dr (YTD)',codes:['01-28','02-027']},
  prepaidTax:{label:'Prepaid Tax (advance tax paid)',use:'Credits for the period',codes:['001-0025']},
  depreciation:{label:'Depreciation expense accounts',use:'Cross-check only – Dr (YTD)',codes:['01-23','02-017']},
  bookedCIT:{label:'Corporate income tax expense (booked)',use:'Cross-check only – Dr (YTD)',codes:['002-0063']},
  bookedDT:{label:'Deferred tax expense (booked)',use:'Cross-check only – Cr − Dr (YTD)',codes:['002-0065']}
};
const sum=a=>a.reduce((x,y)=>x+y,0);
const MAN_TARGETS={A1:'CIT · A1 Guarantee fee above market value',A2:'CIT · A2 Entertainment expenses',A3:'CIT · A3 Tax and dues',A4:'CIT · A4 Provisions made during the year',A5:'CIT · A5 Provisions utilized during the year',A6:'CIT · A6 Depreciation difference',other:'CIT · Other tax adjustment (new line)',taxFA:'Deferred tax · Fixed assets as per the tax working',dtProv:'Deferred tax · Provisions (deferred tax asset base)'};
function pick(tb,codes,field){
  const rows=[],missing=[];
  for(const code of codes){ const hit=tb.accts.filter(a=>a.code===code); if(!hit.length) missing.push(code); rows.push(...hit); }
  return {amount:sum(rows.map(a=>typeof field==='function'?field(a):a[field])),rows,missing};
}
function calcPPE(p){
  const g=p.groups.map((name,i)=>{
    const halfAdd=(p.addCur[i]+p.addPrior[i])*0.5, halfCons=(p.consCur[i]+p.consPrior[i])*0.5;
    const end=p.open[i]+halfAdd-halfCons, dep=end*p.rate[i], base=end-dep, allowed=base*0.04;
    const rmDis=i===0?0:Math.max(0,p.rm[i]-allowed);
    return {name,open:p.open[i],addCur:p.addCur[i],addPrior:p.addPrior[i],halfAdd,consCur:p.consCur[i],consPrior:p.consPrior[i],halfCons,end,rate:p.rate[i],dep,base,allowed,rm:p.rm[i],rmDis,cf:end-dep+rmDis};
  });
  const T=k=>sum(g.map(x=>x[k]));
  const tot={open:T('open'),addCur:T('addCur'),addPrior:T('addPrior'),halfAdd:T('halfAdd'),consCur:T('consCur'),consPrior:T('consPrior'),halfCons:T('halfCons'),end:T('end'),dep:T('dep'),rmDis:T('rmDis'),cf:T('cf'),rm:T('rm'),allowed:T('allowed'),base:T('base')};
  return {g,tot,gl:p.gl,depDiff:p.gl==null?null:p.gl-tot.dep};
}
function calcGuar(gu){
  const mr=gu.marketRate;
  const items=gu.items.map(x=>{ const fee=x.principal/360*x.days*x.rate; const mv=mr==null?null:x.principal/360*x.days*mr; return {...x,fee,mv,dis:mv==null?null:fee-mv}; });
  const fee=sum(items.map(x=>x.fee));
  return {items,marketRate:mr,fee,mv:mr==null?null:sum(items.map(x=>x.mv)),dis:mr==null?null:sum(items.map(x=>x.dis)),wht:fee*0.05};
}
function compute(st){
  const R={ready:{},missing:[]}; const k=st.keyins, map=st.map;
  const num=v=>v===''||v==null?null:v;
  R.rate=num(k.taxRate); R.share=num(k.share);
  if(st.ppe) R.ppe=calcPPE(st.ppe);
  if(st.prov){ const it=st.prov.items; R.prov={items:it,open:sum(it.map(x=>x.open)),prov:sum(it.map(x=>x.prov)),util:sum(it.map(x=>x.util)),adj:sum(it.map(x=>x.adj)),end:sum(it.map(x=>x.end))}; }
  if(st.guar) R.guar=calcGuar(st.guar);
  if(st.tb){ const tb=st.tb; const P=(key,f)=>pick(tb,map[key].codes,f);
    R.tb={revenue:P('revenue','ytdCr'),otherIncome:P('otherIncome','ytdCr'),cost:P('cost','ytdDr'),ga:P('ga','ytdDr'),nonOpExp:P('nonOpExp','ytdDr'),interest:P('interest','ytdDr'),
      entertainment:P('entertainment','ytdDr'),taxDues:P('taxDues','ytdDr'),prepaidTax:P('prepaidTax','cr'),depreciation:P('depreciation','ytdDr'),bookedCIT:P('bookedCIT','ytdDr'),bookedDT:P('bookedDT',a=>a.ytdCr-a.ytdDr)};
    R.tb.income=R.tb.revenue.amount+R.tb.otherIncome.amount;
    R.tb.expense=R.tb.cost.amount+R.tb.ga.amount+R.tb.nonOpExp.amount+R.tb.interest.amount;
    R.tb.netProfit=R.tb.income-R.tb.expense;
  }
  // Corporate income tax
  const guarOK=st.guarNA||(R.guar&&R.guar.dis!=null);
  if(!st.tb) R.missing.push('Trial Balance');
  if(!st.prov) R.missing.push('Provision Movement');
  if(!st.ppe) R.missing.push('PPE – Depreciation'); else if(R.ppe.depDiff==null) R.missing.push('PPE – Depreciation: "Depreciation + Amortization as per GL" amount');
  if(!guarOK) R.missing.push(st.guar?'Normal Guarantee: market value rate (%)':'Normal Guarantee (or tick "Not applicable")');
  if(R.rate==null) R.missing.push('Applicable tax rate');
  R.citReady=R.missing.length===0;
  if(R.citReady){
    const adj=[
      {ref:'A1',label:'Guarantee fee above market value (related party)',src:st.guarNA?'Marked "Not applicable" – fee rate equals market rate':'Normal Guarantee: Σ (Guarantee fee − Market value)',amt:st.guarNA?0:R.guar.dis,det:'guar'},
      {ref:'A2',label:'Entertainment expenses',src:'Trial Balance Dr (YTD): '+map.entertainment.codes.join(', '),amt:R.tb.entertainment.amount,det:'entertainment'},
      {ref:'A3',label:'Tax and dues',src:'Trial Balance Dr (YTD): '+map.taxDues.codes.join(', '),amt:R.tb.taxDues.amount,det:'taxDues'},
      {ref:'A4',label:'Provisions made during the year',src:'Provision Movement: total "Provided during the year"',amt:R.prov.prov,det:'prov'},
      {ref:'A5',label:'Provisions utilized during the year',src:'Provision Movement: − total "Utilized during the year"',amt:-R.prov.util,det:'prov'},
      {ref:'A6',label:'Depreciation difference',src:'PPE – Depreciation: Depreciation per GL − Depreciation per ZATCA rates',amt:R.ppe.depDiff,det:'ppe'}];
    const man=st.manual||[]; let oi=adj.length+1;
    for(const a of adj){ a.base=a.amt; a.manual=man.filter(m=>m.target===a.ref); a.amt+=sum(a.manual.map(m=>m.amt)); }
    for(const m of man.filter(m=>m.target==='other')) adj.push({ref:'A'+(oi++),label:'Other adjustment: '+m.desc,src:'Manual adjustment (key-in on the Inputs tab)',amt:m.amt,base:null,manual:[],det:null});
    const totalAdj=sum(adj.map(a=>a.amt)), taxable=R.tb.netProfit+totalAdj, tax=taxable*R.rate, prepaid=R.tb.prepaidTax.amount;
    R.cit={adj,totalAdj,taxable,tax,prepaid,due:tax-prepaid};
  }
  // Deferred tax
  R.dtMissing=[];
  if(!st.ppe) R.dtMissing.push('PPE – Depreciation');
  if(!st.prov) R.dtMissing.push('Provision Movement');
  if(num(k.fsFA)==null) R.dtMissing.push('Key-in: Fixed assets as per the Financial statements');
  if(num(k.priorDT)==null) R.dtMissing.push('Key-in: Deferred tax of prior year as per audited FS');
  if(R.rate==null) R.dtMissing.push('Applicable tax rate');
  if(R.share==null) R.dtMissing.push('Non-Saudi shareholding percentage');
  R.dtReady=R.dtMissing.length===0;
  if(R.dtReady){
    const mFA=(st.manual||[]).filter(m=>m.target==='taxFA'), mPv=(st.manual||[]).filter(m=>m.target==='dtProv');
    const taxFA=R.ppe.tot.cf+0.5*R.ppe.tot.addCur-0.5*R.ppe.tot.consCur+sum(mFA.map(m=>m.amt));
    const diff=taxFA-k.fsFA, dtlBase=-diff, dtl=dtlBase*R.rate, dtaBase=R.prov.end+sum(mPv.map(m=>m.amt)), dta=dtaBase*R.rate, net=(dta-dtl)*R.share;
    R.dt={taxFA,fsFA:k.fsFA,diff,dtlBase,dtl,dtaBase,mFA,mPv,dta,net,prior:k.priorDT,movement:net-k.priorDT};
  }
  return R;
}

  if(!st.prov) add('err','Provision Movement has not been provided.','Upload the "1.Provision Movement" sheet on the Inputs tab.','inputs');
  if(!st.ppe) add('err','PPE – Depreciation has not been provided.','Upload the "2.PPE- Depreciation" sheet on the Inputs tab.','inputs');
  if(!st.guar&&!st.guarNA) add('err','Normal Guarantee has not been provided and is not marked as "Not applicable".','Upload the "3.Normal Guarantee" sheet, or tick "Not applicable" if the guarantee fee rate equals the market rate.','inputs');
  if(st.keyins.fsFA===''||st.keyins.fsFA==null) add('err','Key-in missing: Fixed assets as per the Financial statements.','Type the net book value of fixed assets from the financial statements on the Inputs tab. It is needed for Deferred Tax.','inputs');
  if(st.keyins.priorDT===''||st.keyins.priorDT==null) add('err','Key-in missing: Deferred tax of the prior year as per audited FS.','Type the prior-year closing deferred tax balance on the Inputs tab. It is needed for the deferred tax movement.','inputs');
  if(st.guar&&st.guar.marketRate==null&&!st.guarNA) add('err','Normal Guarantee: the market value rate (%) was not found under the "Market Value" header.','Add the market rate (e.g. 1.85%) in the cell below "Market Value" and upload the sheet again.','inputs');
  if(st.guar&&st.guarNA) add('info','Normal Guarantee data is uploaded but "Not applicable" is ticked, so the guarantee add-back is 0.','Untick "Not applicable" on the Inputs tab if the uploaded guarantee schedule should be used.','inputs');
  if(st.tb){
    if(!yr) add('warn','The fiscal year could not be read from the trial balance (expected text like "[Date range 01/01/2025 to 31/12/2025]").','Check that the uploaded file is the full-year trial balance. Titles will show no year.','data');
    const lab=k=>st.map[k].label;
    for(const k of Object.keys(st.map)){ const m=R.tb[k].missing; if(!m.length) continue;
      const cross=['depreciation','bookedCIT','bookedDT'].includes(k), zero=['prepaidTax'].includes(k);
      add(cross||zero?'info':'warn','Account code '+m.join(', ')+' ('+lab(k)+') was not found in the trial balance; it is counted as 0.',cross?'This only affects a cross-check. If the code changed, update it under "Account mapping" on the Inputs tab.':'If the account code changed in the ERP, update it under "Account mapping" on the Inputs tab. If the account has no balance this year, no action is needed.','inputs'); }
    const mapped=new Set([...st.map.entertainment.codes,...st.map.taxDues.codes]);
    const sus=st.tb.accts.filter(a=>!mapped.has(a.code)&&a.ytdDr!==0&&(/entertain/i.test(a.name)||/tax\s*(&|and)\s*dues/i.test(a.name)));
    if(sus.length) add('warn','These accounts look like Entertainment / Tax & Dues but are not included in the disallowed add-backs: '+sus.map(a=>a.name+' ['+a.code+']').join('; ')+'.','If they should be disallowed, add their codes under "Account mapping" on the Inputs tab.','inputs');
    const g=st.tb.grand; if(g&&Math.abs(g.ytdDr-g.ytdCr)>0.005) add('warn','Trial balance Grand Total is not balanced: Dr (YTD) '+fmt(g.ytdDr)+' vs Cr (YTD) '+fmt(g.ytdCr)+'.','Re-export the trial balance from the ERP and upload it again.','data');
    if(st.tb.profit){ const p=st.tb.profit; const tbProfit=(p.ytdCr-p.ytdDr); const exp=R.tb.netProfit-R.tb.bookedCIT.amount+R.tb.bookedDT.amount;
      if(Math.abs(tbProfit-exp)>0.01) add('warn','Net profit does not reconcile to the trial balance. Calculated net profit before tax '+fmt(R.tb.netProfit)+' − booked CIT '+fmt(R.tb.bookedCIT.amount)+' + booked deferred tax '+fmt(R.tb.bookedDT.amount)+' = '+fmt(exp)+', but "Profit for the period" in the trial balance is '+fmt(tbProfit)+' (difference '+fmt(exp-tbProfit)+').','An income or expense account may sit outside the mapped parent accounts. Review "Account mapping" on the Inputs tab.','cit');
      else add('ok','Net profit reconciles to "Profit for the period" in the trial balance ('+fmt(tbProfit)+' after booked tax).','','cit'); }
    if(R.ppe&&R.ppe.gl!=null&&!R.tb.depreciation.missing.length&&Math.abs(R.ppe.gl-R.tb.depreciation.amount)>0.01) add('warn','Depreciation per GL in the PPE sheet ('+fmt(R.ppe.gl)+') differs from the depreciation accounts in the trial balance ('+fmt(R.tb.depreciation.amount)+').','Check the "Depreciation + Amortization as per GL" amount in the PPE sheet.','data');
  }
  if(st.prov){ for(const x of st.prov.items){ const calc=x.open+x.prov-x.util+x.adj; if(Math.abs(calc-x.end)>0.5) add('warn','Provision "'+x.name+'" does not roll forward: Opening + Provided − Utilized + Adjustments = '+fmt(calc)+', but Ending Balance is '+fmt(x.end)+'.','Check the Provision Movement sheet. The ending balance as given is used for Deferred Tax.','data'); } }
  if(R.ppe){
    if(R.ppe.gl==null) add('err','PPE – Depreciation: the "Depreciation + Amortization as per GL" amount was not found.','Fill that amount in the Totals column of the PPE sheet and upload again.','inputs');
    if(R.ppe.tot.rmDis>0) add('warn','Repair & maintenance above the 4% limit: '+fmt(R.ppe.tot.rmDis)+' is added to the asset group balance carried forward, but the Excel working has no line adding it back to taxable profit, so this app does not add it back either.','Please confirm whether this amount should also be added to taxable profit.','cit');
    if(R.ppe.tot.consCur!==0) add('warn','Current-year considerations (disposal proceeds) are '+fmt(R.ppe.tot.consCur)+'. For Deferred Tax, the tax base of fixed assets follows the note text ("… − 50% of current year considerations"), while the formula in the Excel working did not subtract it.','Please confirm which treatment is correct.','dt');
    if(st.ppe.groups.length!==6) add('warn','PPE – Depreciation has '+st.ppe.groups.length+' asset group columns; 6 were expected (Land + Groups 1–5).','Check the header row of the PPE sheet.','data');
  }
  if(R.guar&&!st.guarNA){

    if(R.guar.marketRate!=null&&st.guar.items.every(x=>x.rate===R.guar.marketRate)) add('info','Guarantee fee rate equals the market rate on every line; the add-back is 0.','No action needed.','data');
  }
  if(R.share!=null&&R.share!==1) add('warn','Non-Saudi shareholding is '+(R.share*100)+'%. As in the Excel working, this percentage is applied to Deferred Tax only; Corporate Income Tax uses the tax rate on 100% of taxable profit and Zakat is not calculated.','Please confirm the treatment for mixed ownership before using the result.','cit');
  if(R.cit){
    if(R.cit.taxable<0) add('warn','Taxable profit is negative (tax loss). The app shows a negative tax amount; loss carry-forward is not calculated.','Treat the income tax for the year as nil and review the loss carry-forward separately.','cit');
  }
  if((st.manual||[]).length) add('info',st.manual.length+' manual adjustment'+(st.manual.length>1?'s are':' is')+' applied: '+st.manual.map(m=>(MAN_TARGETS[m.target]||m.target)+' '+fmt(m.amt)+' ('+m.desc+')').join('; ')+'.','They are shown as separate lines in the computation. Review them under "Manual adjustments" on the Inputs tab.','inputs');

    if(prev.ppe&&R.ppe){ const d=R.ppe.g.map((g,i)=>({g,p:prev.ppe.g[i]})).filter(x=>x.p&&Math.abs(x.g.open-x.p.cf)>0.5);

    if(prev.dt&&st.keyins.priorDT!==''&&st.keyins.priorDT!=null&&Math.abs(st.keyins.priorDT-prev.dt.net)>0.5) add('info','Key-in "Deferred tax of prior year" ('+fmt(st.keyins.priorDT)+') differs from the FY'+py+' net deferred tax position saved in this app ('+fmt(prev.dt.net)+').','No action needed if the key-in agrees with the audited financial statements.','inputs');
    if(prev.prov&&R.prov&&Math.abs(R.prov.open-prev.prov.end)>0.5) add('info','Provision opening balance ('+fmt(R.prov.open)+') differs from the FY'+py+' ending balance saved in this app ('+fmt(prev.prov.end)+').','Check the Provision Movement sheet if this is not expected.','data'); }
  return out;
}

function folderStore(root){

    async read(p){ try{ const parts=p.split('/'),f=parts.pop(); const d=await dirOf(parts,false); const h=await d.getFileHandle(f); return new Uint8Array(await (await h.getFile()).arrayBuffer()); }catch(e){ if(e.name==='NotFoundError'||e.name==='TypeMismatchError') return null; throw e; } },
    async write(p,u8){ const parts=p.split('/'),f=parts.pop(); const d=await dirOf(parts,true); const h=await d.getFileHandle(f,{create:true}); const w=await h.createWritable(); await w.write(u8); await w.close(); },
    async list(dir){ try{ const d=await dirOf(dir?dir.split('/'):[],false); const out=[]; for await(const [n] of d.entries()) out.push(n); return out.sort(); }catch(e){ return []; } }};

function save(){ if(App.year==null) return saveQ; const y=App.year, snap=JSON.stringify(st); App.hist[y]=JSON.parse(snap);
  saveQ=saveQ.then(()=>doSave(y,snap)).catch(e=>{ App.savedMsg='NOT saved – '+(e&&e.message||e); renderHeader(); toast('Your change could not be saved: '+(e&&e.message||e)+' Check the shared folder connection.'); }); return saveQ; }
async function doSave(y,snap){
  if(App.conflict) return;
  const cur=await readState(y);
  if(cur&&App.year===y&&(cur.savedAt||null)!==App.loadedAt){ App.conflict=true; render(); return; }
  const s=JSON.parse(snap); s.savedAt=new Date().toISOString();
  await App.store.write(yearDir(y)+'/data.json',te.encode(JSON.stringify({app:'sgc-cit',version:2,state:s},null,1)));
  App.hist[y]=s; if(!App.years.includes(y)){ App.years.push(y); App.years.sort((a,b)=>b-a); }
  if(App.year===y){ st.savedAt=s.savedAt; App.loadedAt=s.savedAt; }
  App.savedMsg='Saved '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); renderHeader();
}

function fmt(v,d=2){ if(v==null||v==='') return '–'; const a=Math.abs(v); if(a<0.5*Math.pow(10,-d)) return (0).toFixed(d); const s=a.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return v<0?'('+s+')':s; }

function xlDate(v){ if(typeof v!=='number') return esc(S(v)); const d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
function parseNum(s){ s=String(s).trim(); if(s==='') return ''; let neg=false; if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);} s=s.replace(/,/g,'').replace(/\s/g,''); let p=false; if(/%$/.test(s)){p=true;s=s.slice(0,-1);} if(s===''||isNaN(Number(s))) return NaN; let v=Number(s); if(p) v/=100; return neg?-v:v; }

async function connectFolder(handle){
  App.connectMsg=''; let step='pick';
  try{
    if(!handle) handle=await window.showDirectoryPicker({mode:'readwrite'});
    step='permission';
    const perm=handle.requestPermission?await handle.requestPermission({mode:'readwrite'}):'granted';
    if(perm!=='granted'){ App.connectMsg='The browser did not give permission to edit the folder "'+handle.name+'". Click Connect shared folder again and choose "Edit files" / "Allow".'; return render(); }
    step='test';
    const fh=await handle.getFileHandle('.cit-write-test',{create:true}); const w=await fh.createWritable(); await w.write('ok'); await w.close(); await handle.removeEntry('.cit-write-test');
    await saveQ;
    App.store=folderStore(handle); App.pending=null; try{ await idb.set('dirHandle',handle); }catch(e){}
    await loadAll(); App.year=null; st=blank(); if(App.years.length) await openYear(App.years[0]);
    tab=App.years.length?tab:'inputs'; render(); toast('Connected to shared folder: '+handle.name+(App.years.length?'':' (no saved years yet)'));
  }catch(e){
    if(e.name==='AbortError'&&step==='pick') return;
    const why=e.name==='SecurityError'||e.name==='NotAllowedError'?'The browser or a company policy blocked access to this folder.':e.name==='NoModificationAllowedError'||e.name==='InvalidModificationError'?'The folder is read-only for this Windows user (the share permission must be Read/Write).':'The folder could not be opened.';
    App.connectMsg=why+' (Step: '+step+'. Details: '+e.name+' – '+e.message+') Try choosing the folder by its network path instead of a drive letter.'; render();
  }
}

async function handleFiles(fileList){
  if(App.year==null){ toast('Choose the fiscal year first, then upload the files.'); return; }
  if(st.final){ toast('FY'+App.year+' is marked as final. Unlock it on the Inputs tab before uploading.'); return; }
  const msgs=[]; let changed=false; const before=JSON.stringify(st);
  for(const f of fileList){
    if(/\.xls$/i.test(f.name)){ msgs.push(f.name+': old .xls format is not supported. Open it in Excel and "Save As" .xlsx, then upload again.'); continue; }
    if(!/\.xlsx$|\.xlsm$/i.test(f.name)){ msgs.push(f.name+': not an Excel file. Please upload .xlsx files.'); continue; }
    let sheets,buf; try{ buf=await f.arrayBuffer(); sheets=await readXlsx(buf); }catch(e){ msgs.push(f.name+': '+e.message); continue; }
    let found=0;
    for(const sh of sheets){ const kind=detectKind(sh.rows); if(!kind) continue;
      try{ const parsed=PARSERS[kind](sh.rows);
        if(kind==='tb'&&parsed.year&&parsed.year!==App.year){ msgs.push('The trial balance in "'+f.name+'" is for '+parsed.year+', but you are working on fiscal year '+App.year+'. It was NOT loaded. Choose fiscal year '+parsed.year+' in the top bar (or start it as a new year) and upload again.'); found++; continue; }
        const replaced=!!st[kind]; st[kind]=parsed; st.src[kind]={file:f.name,sheet:sh.name,at:new Date().toISOString()}; found++; changed=true;
        msgs.push((replaced?'Replaced ':'Loaded ')+KIND_LABEL[kind]+' from sheet "'+sh.name+'".'); }
      catch(e){ msgs.push(f.name+' / sheet "'+sh.name+'": '+e.message); } }
    if(!found) msgs.push(f.name+': no recognizable sheet was found. Expected a Trial Balance, Provision Movement, PPE – Depreciation or Normal Guarantee sheet in the standard layout (see Help).');
    else if(changed){ try{ await App.store.write(yearDir(App.year)+'/source/'+f.name,new Uint8Array(buf)); }catch(e){ msgs.push('The original file could not be copied to the shared folder ('+e.message+').'); } }
  }
  if(changed){ undoSnap=before; save(); }
  render(); toast(msgs.join(' '),changed);
}

function paintSide(){
  const el=document.getElementById('side'), R=window.__R; let row=null;
  document.querySelectorAll('tr.src-open').forEach(r=>r.classList.remove('src-open'));
  if(side&&side.tab===tab){ const sec=document.getElementById('tab-'+tab)&&document.querySelector('section[aria-labelledby="tab-'+tab+'"]'); row=sec&&sec.querySelector('[data-id="'+CSS.escape(side.id)+'"][data-srck]'); }
  if(!row||!st[side.kind]){ side=null; document.body.classList.remove('split'); el.innerHTML=''; return; }
  document.body.classList.add('split'); row.classList.add('src-open'); el.innerHTML=sideHtml(R,row); el.scrollTop=0;

  sideGoto(0);
}
/* scroll to the i-th marked cell and say where it is (row / column), so the location is clear even in wide tables */
function sideGoto(i){
  const el=document.getElementById('side'); const cells=side.cells.map(k=>el.querySelector('[data-ck="'+CSS.escape(k)+'"]')).filter(Boolean); if(!cells.length) return;
  i=(i+cells.length)%cells.length; side.idx=i; const c=cells[i];
  const tr=c.parentNode, table=c.closest('table'), ths=table.tHead?[...table.tHead.rows[0].cells]:[]; let ci=0; for(const td of tr.cells){ if(td===c) break; ci+=td.colSpan||1; }
  const rowLab=(tr.cells[0].textContent||'').replace(/\s+/g,' ').trim(), th=ths[ci]; const colLab=th?(th.firstChild&&th.firstChild.nodeType===3?th.firstChild.textContent:th.textContent).trim():'';
  document.getElementById('sideWhere').innerHTML='Location: row <b>'+esc(rowLab.length>70?rowLab.slice(0,68)+'…':rowLab)+'</b>'+(colLab?' · column <b>'+esc(colLab)+'</b>':'')+' · amount <b>'+esc(c.textContent)+'</b>'
    +(cells.length>1?' <span class="noprint" style="white-space:nowrap">· marked cell '+(i+1)+' of '+cells.length+' <button id="sidePrev" title="Previous marked cell">◀</button> <button id="sideNext" title="Next marked cell">▶</button></span>':'');
  if(cells.length>1){ document.getElementById('sidePrev').onclick=()=>sideGoto(side.idx-1); document.getElementById('sideNext').onclick=()=>sideGoto(side.idx+1); }
  const x=c.closest('.xscroll'); if(x){ const xr=x.getBoundingClientRect(), r0=c.getBoundingClientRect(); x.scrollLeft=Math.max(0,x.scrollLeft+r0.right-xr.right+12); }
  const cr=c.getBoundingClientRect(), er=el.getBoundingClientRect(), head=el.querySelector('.shead').offsetHeight;
  el.scrollTop=Math.max(0,el.scrollTop+cr.top-er.top-head-(er.height-head)/2+cr.height/2);
}
function closeSide(){ if(!side) return; const id=side.id; side=null; paintSide(); const r=document.querySelector('section[aria-labelledby="tab-'+tab+'"] [data-id="'+CSS.escape(id)+'"]'); if(r) r.focus({preventScroll:true}); }
function openSource(row){
  hlClear();
  if(row.dataset.srck==='input'){ go('inputs'); const f=document.getElementById(row.dataset.srcc); if(f){ f.scrollIntoView({block:'center'}); f.focus(); } return; }

}
document.addEventListener('click',e=>{ const t=e.target; if(!t.closest||t.closest('#side')) return; const row=t.closest('tr[data-srck]'); if(!row) return; if(t.closest('summary,details,a')||(t.closest('button')&&!t.closest('.srcbtn'))) return; openSource(row); });

/* Report row with Excel-F2-style precedents: data-id = this line, data-deps = the lines it is calculated from. */
function hrow(o){
  const id=o.id||o.ref||''; const deps=o.deps||[]; let src=o.src||'';
  deps.forEach(d=>{ if(d.includes('.')) return; const re=new RegExp('(^|[^A-Za-z0-9])('+d.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z0-9])'); src=src.replace(re,'$1<span class="tok" data-tok="'+d+'">$2</span>'); });
  const lab=String(o.label).replace(/<[^>]*>/g,'');
  const val=o.valHtml!==undefined?o.valHtml:(o.amt===undefined?'<td></td>':cellN(o.amt));
  const sc=o.source&&(o.source.kind==='input'||st[o.source.kind])?o.source:null;
  if(sc) src+=' <button class="link srcbtn noprint" tabindex="-1">'+(sc.kind==='input'?'Go to key-in ▸':'View source ▸')+'</button>';
  return '<tr class="'+(o.cls||'')+'"'+(id?' data-id="'+esc(id)+'" data-ref="'+esc(o.ref||'')+'" data-label="'+lab+'" tabindex="0"':'')+(deps.length?' data-deps="'+deps.join(',')+'"':'')+(sc?' data-srck="'+sc.kind+'" data-srcc="'+esc(sc.kind==='input'?sc.field:sc.cells.join('|'))+'" title="'+(sc.kind==='input'?'Click to go to this key-in on the Inputs tab':'Click to show the source data beside this report')+'"':'')+'><td class="ref">'+(o.ref||'')+'</td><td>'+o.label+'</td><td class="formula">'+src+'</td>'+val+'</tr>';
}

function setKey(el){
  const key=el.dataset.key, err=document.getElementById('e-'+key); let v=parseNum(el.value);

  if(el.dataset.pct){ if(v===''){ el.classList.add('bad'); err.textContent='This percentage is required.'; return; } if(!/%$/.test(el.value.trim())) v=v/100; if(v<0||v>1){ el.classList.add('bad'); err.textContent='Enter a percentage between 0 and 100.'; return; } }

  el.classList.remove('bad'); el.removeAttribute('aria-invalid'); err.textContent='';

const HL_COLORS=['#1f5fa8','#c0392b','#7b3fa0','#1b7f4b','#b35c00','#0f7c8c','#a8326e','#5b6b00'];
let hlRow=null;
function hlClear(){ if(!hlRow) return; document.querySelectorAll('.hl-focus,.hl-prec').forEach(e=>{e.classList.remove('hl-focus','hl-prec'); e.style.removeProperty('--pc');}); document.querySelectorAll('.tok.on').forEach(t=>t.classList.remove('on')); document.getElementById('hltip').style.display='none'; hlRow=null; }
function hlShow(row){
  if(row===hlRow) return; hlClear(); hlRow=row; row.classList.add('hl-focus');
  const scope=row.closest('section'), deps=(row.dataset.deps||'').split(',').filter(Boolean), val=r=>{ const c=r.querySelectorAll('td.n'); return c.length?c[c.length-1].textContent:''; };
  const name=r=>(r.dataset.ref?'<b>'+esc(r.dataset.ref)+'</b> ':'')+esc(r.dataset.label||'');
  let list='';
  deps.forEach((d,i)=>{ const c=HL_COLORS[i%HL_COLORS.length]; const el=scope.querySelector('[data-id="'+CSS.escape(d)+'"]');
    row.querySelectorAll('.tok[data-tok="'+CSS.escape(d)+'"]').forEach(t=>{t.classList.add('on'); t.style.setProperty('--pc',c);});
    if(!el) return; el.classList.add('hl-prec'); el.style.setProperty('--pc',c);
    list+='<div class="tiprow"><span class="chip" style="background:'+c+'"></span><span class="tl">'+name(el)+'</span><span class="tv">'+esc(val(el))+'</span></div>'; });
  const f=row.querySelector('.formula'); const src=f?f.innerHTML:esc(row.dataset.src||'');
  const tip=document.getElementById('hltip');
  tip.innerHTML='<div class="th">'+name(row)+'</div>'+(deps.length?'<div class="tf">= '+src+'</div>'+list+'<div class="tiprow tres"><span class="tl">Result</span><span class="tv">'+esc(val(row))+'</span></div>':'<div class="tf">Input – '+(src||'source data')+'</div><div class="tiprow tres"><span class="tl">Amount</span><span class="tv">'+esc(val(row))+'</span></div>');
  tip.style.display='block'; hlPlace();
}
function hlPlace(){
  if(!hlRow) return; const tip=document.getElementById('hltip');
  const cells=hlRow.querySelectorAll('td.n'), a=(cells.length?cells[cells.length-1]:hlRow).getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let left=Math.max(8,Math.min(a.right-w,window.innerWidth-w-8)), top=a.bottom+6;
  if(top+h>window.innerHeight-8){ /* no room below: sit to the left of the amount column so the highlighted amounts above stay visible */
    if(a.left-w-12>=8){ left=a.left-w-12; top=Math.max(8,Math.min(a.bottom-h,window.innerHeight-h-8)); } else top=Math.max(8,a.top-h-6); }
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function hlTarget(el){
  if(!el||!el.closest) return null; const sec=el.closest('section'); if(!sec) return null;
  const k=el.closest('[data-hl]'); if(k) return sec.querySelector('[data-id="'+CSS.escape(k.dataset.hl)+'"]');
  return el.closest('.hltable tr[data-id]');
}

(async function init(){
  try{ const h=window.showDirectoryPicker?await idb.get('dirHandle'):null;
    if(h){ if(!h.queryPermission||(await h.queryPermission({mode:'readwrite'}))==='granted') App.store=folderStore(h); else App.pending=h; } }catch(e){}
  try{ await loadAll(); if(App.years.length) await openYear(App.years[0]); }catch(e){ App.connectMsg='Saved data could not be read ('+(e&&e.message||e)+'). Reconnect the shared folder.'; }
  render(); window.__ready=true;
  if(App.pending) toast('Click "Reconnect shared folder" (top right) to load the team data.');
})();
</script>
</body>
</html>
